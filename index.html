<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UG Souq</title>
    <script>
      (() => {
        const isAdmin = window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin/')
        const manifest = document.createElement('link')
        manifest.rel = 'manifest'
        manifest.href = isAdmin ? '/admin-manifest.webmanifest' : '/manifest.webmanifest'
        document.head.appendChild(manifest)

        const appleTitle = document.createElement('meta')
        appleTitle.name = 'apple-mobile-web-app-title'
        appleTitle.content = isAdmin ? 'UGSouq Admin' : 'UG Souq'
        document.head.appendChild(appleTitle)

        if (isAdmin) document.title = 'UGSouq Admin'
      })()
    </script>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#e85d04" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Uganda's online market — phones, fashion, farm produce and food delivery, paid with MTN MoMo & Airtel Money." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
